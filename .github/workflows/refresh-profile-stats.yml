name: Refresh GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-profile-stats.yml"
      - "scripts/generate_stats.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate metrics from GitHub GraphQL
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_stats.py
      - name: Commit generated SVGs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-overview.svg assets/stats-languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh verified GitHub profile statistics"
            git push
          fi
